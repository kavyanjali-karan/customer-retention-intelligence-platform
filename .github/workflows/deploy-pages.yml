name: Deploy Retention Dashboard

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "python/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy faker pytest matplotlib

      - name: Run tests
        run: python -m pytest tests/ -v

      # Rebuild the dashboards from the committed data so the published site
      # always matches the images and numbers in the README.
      - name: Regenerate dashboards
        run: |
          python -c "import pathlib, tempfile, urllib.request; pathlib.Path(tempfile.gettempdir(), 'chart.min.js').write_bytes(urllib.request.urlopen('https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js').read())"
          python python/generate_dashboard_pngs.py
          python python/generate_dashboards.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: assets

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
